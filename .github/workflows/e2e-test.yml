name: "Arweave e2e  Tests Suites"
on:
  workflow_dispatch:

# One e2e run per ref at a time: a new dispatch on the same branch
# supersedes an in-progress one, so e2e never stacks on itself and
# double-loads the e2e-runner pool. Branch dispatches and the
# daily master cron are separate refs, so they don't cancel each other.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, ubuntu, amd64, build-runner]
    steps:
      # Clean workspace first (matches x-build.yml) so stale build
      # outputs from a previous job can't leak in.
      - name: cleanup
        if: always()
        run: rm -rf "${GITHUB_WORKSPACE}" && mkdir -p "${GITHUB_WORKSPACE}"

      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
          lfs: false

      # only arweave dependencies are being cached,
      # those are not updated everyday and this is
      # unecessary to fetch them everytime.
      - uses: actions/cache@v4
        id: cache
        with:
          path: |
            _build/default/lib/accept
            _build/default/lib/b64fast
            _build/default/lib/cowboy
            _build/default/lib/cowlib
            _build/default/lib/gun
            _build/default/lib/jiffy
            _build/default/lib/prometheus
            _build/default/lib/prometheus_cowboy
            _build/default/lib/prometheus_httpd
            _build/default/lib/prometheus_process_collector
            _build/default/lib/quantile_estimator
            _build/default/lib/ranch
            _build/default/lib/.rebar3
            _build/default/lib/recon
            _build/default/lib/rocksdb
            _build/default/plugins/
            _build/default/plugins/aleppo
            _build/default/plugins/geas
            _build/default/plugins/geas_rebar3
            _build/default/plugins/hex_core
            _build/default/plugins/katana_code
            _build/default/plugins/pc
            _build/default/plugins/.rebar3
            _build/default/plugins/rebar3_archive_plugin
            _build/default/plugins/rebar3_elvis_plugin
            _build/default/plugins/rebar3_hex
            _build/default/plugins/samovar
            _build/default/plugins/verl
            _build/default/plugins/zipper
          key: deps-cache-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            deps-cache-${{ hashFiles('rebar.lock') }}

      - name: Get dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./ar-rebar3 test get-deps

      - uses: actions/cache@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            _build/default/lib/accept
            _build/default/lib/b64fast
            _build/default/lib/cowboy
            _build/default/lib/cowlib
            _build/default/lib/gun
            _build/default/lib/jiffy
            _build/default/lib/prometheus
            _build/default/lib/prometheus_cowboy
            _build/default/lib/prometheus_httpd
            _build/default/lib/prometheus_process_collector
            _build/default/lib/quantile_estimator
            _build/default/lib/ranch
            _build/default/lib/.rebar3
            _build/default/lib/recon
            _build/default/lib/rocksdb
            _build/default/plugins/
            _build/default/plugins/aleppo
            _build/default/plugins/geas
            _build/default/plugins/geas_rebar3
            _build/default/plugins/hex_core
            _build/default/plugins/katana_code
            _build/default/plugins/pc
            _build/default/plugins/.rebar3
            _build/default/plugins/rebar3_archive_plugin
            _build/default/plugins/rebar3_elvis_plugin
            _build/default/plugins/rebar3_hex
            _build/default/plugins/samovar
            _build/default/plugins/verl
            _build/default/plugins/zipper
          key: deps-cache-${{ hashFiles('rebar.lock') }}

      - name: Compile arweave release
        run: ./ar-rebar3 default release
          
      - name: Build arweave test sources
        run: ./ar-rebar3 test compile

      - name: Build arweave e2e test sources
        run: ./ar-rebar3 e2e compile

      - uses: ./.github/actions/ensure-zstd

      # some artifacts are compiled and only available
      # in arweave directy (libraries)
      - name: Prepare artifacts
        run: |
          chmod -R u+w ./_build
          tar --use-compress-program='zstd -T0 -3' \
              --exclude='_build/default/plugins' \
              --exclude='*/.git' \
              --exclude='*/rocksdb/_build' \
              --exclude='*/rocksdb/deps' \
              -chf _build.tar.zst ./_build ./bin/arweave
          tar --use-compress-program='zstd -T0 -3' \
              -chf apps.tar.zst ./apps
          # Fail the build on a truncated archive rather than uploading a
          # poison artifact: a silently-short .tar.zst (build still exits 0)
          # makes every downstream e2e case fail on extract. sync first so
          # the write is durable before zstd reads it back.
          sync
          zstd -t _build.tar.zst apps.tar.zst

      # to avoid reusing artifacts from someone else
      # and generating issues, an unique artifact is
      # produced using github checksum.
      - name: Push build to LAN cache
        uses: ./.github/actions/push-build
        with:
          ssh-key: ${{ secrets.CI_CACHE_SSH_KEY }}
          cache-key: build-${{ github.sha }}

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          overwrite: true
          path: |
            _build.tar.zst
            apps.tar.zst

  discover-cases:
    # Enumerate every Common Test e2e case so the e2e-tests matrix
    # fans out per-case (max parallelism + per-case isolation). The
    # discovery script scans `apps/*/e2e/*_SUITE.erl' and calls each
    # suite's `all/0' — there is no hand-listed module set in this
    # workflow, so adding a new test SUITE or `all/0' entry is picked
    # up automatically on the next CI run.
    needs: build
    runs-on: [self-hosted, ubuntu, amd64, build-runner]
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
          lfs: false

      - name: Fetch build (LAN cache, fallback to artifact)
        uses: ./.github/actions/fetch-build
        with:
          ssh-key: ${{ secrets.CI_CACHE_SSH_KEY }}
          cache-key: build-${{ github.sha }}

      - id: list
        name: Enumerate CT e2e cases
        run: |
          matrix=$(bash scripts/list_e2e_cases.sh json)
          echo "Discovered matrix: ${matrix}"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  e2e-tests:
    needs: [build, discover-cases]
    # Runs on the dedicated e2e-runner pool (1 runner/host, memory-capped;
    # see infra docs/04): the heavy 3-node-per-case mining jobs spread
    # 1-per-host instead of packing onto one builder and OOM-killing it.
    # The pool caps fleet-wide concurrency, so no max-parallel here.
    runs-on: [self-hosted, ubuntu, amd64, e2e-runner]
    strategy:
      # One job per testcase. fail-fast off so a single flaky case
      # doesn't cancel the rest of the matrix.
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover-cases.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
          lfs: false

      - uses: ./.github/actions/kill-stray-erlang
        if: always()

      - name: Fetch build (LAN cache, fallback to artifact)
        uses: ./.github/actions/fetch-build
        with:
          ssh-key: ${{ secrets.CI_CACHE_SSH_KEY }}
          cache-key: build-${{ github.sha }}


      - name: ${{ matrix.suite }}:${{ matrix.case }}
        id: tests
        run: bash scripts/github_workflow_ct.sh "${{ matrix.suite }}" "${{ matrix.case }}"

      # this part of the job produces test artifacts from logs
      # generated by the tests. It also collect dumps and the files
      # present in .tmp (temporary arweave data store), and the CT
      # log tree under _build/e2e/logs.
      # Uploads on every case (pass and fail), not just failure, so the
      # timestamped node *.out logs and the CT log tree from PASSING cases
      # are available to mine for the per-phase (boot / dataset / pack /
      # mine / restart) timing breakdown. Severed jobs are killed before
      # this step runs, so they never upload regardless of the condition.
      - name: upload logs (always, incl. passing cases for phase analysis)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "logs-${{ matrix.suite }}-${{ matrix.case }}-${{ github.run_attempt }}-${{ job.status }}-${{ runner.name }}-${{ github.sha }}"
          retention-days: 7
          overwrite: true
          include-hidden-files: true
          path: |
            ./logs
            ./_build/e2e/logs
            *.out
            *.dump
