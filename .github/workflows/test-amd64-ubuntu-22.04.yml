######################################################################
# Test suite for Ubuntu 22.04. This is the official OS supported by
# arweave team. The complete test suite should be executed.
######################################################################
name: "Test on arch:amd64 distribution:ubuntu release:22.04"

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/x-build.yml
    secrets: inherit

  test-canary:
    needs: [build]
    uses: ./.github/workflows/x-test-canary.yml
    secrets: inherit

  # test-canary, common-test, and test all need only the build artifact.
  # We don't gate test/common-test on test-canary because canary is a
  # sanity check on the test harness itself, and serializing them adds
  # ~5-7 min of artifact-download cost on every push to defend against
  # a near-zero-probability condition. If canary fails the PR's
  # required-checks reflects that; test runs in parallel anyway.
  common-test:
    needs: [build]
    uses: ./.github/workflows/x-common-test.yml
    secrets: inherit

  test:
    needs: [build]
    uses: ./.github/workflows/x-test-full.yml
    secrets: inherit
