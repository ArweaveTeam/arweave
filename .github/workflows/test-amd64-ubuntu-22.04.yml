######################################################################
# Test suite for Ubuntu 22.04. This is the official OS supported by
# arweave team. The complete test suite should be executed.
######################################################################
name: "Test on arch:amd64 distribution:ubuntu release:22.04"

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# One run per branch at a time: a new push supersedes the run it replaces
# instead of competing with it for the builder pool. Overlapping runs churn
# the runner fleet, and runners that never come online cost jobs a 10-minute
# "lost communication" failure.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # bin/arweave is the committed pre-render of priv/templates/extended_bin
  # (the relx overlay template); a launcher change applied to only one of
  # them ships different behavior to source checkouts vs release installs.
  # Cheap standalone check — needs no build artifact.
  bin-arweave-lockstep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check_bin_arweave_lockstep.sh

  build:
    uses: ./.github/workflows/x-build.yml
    secrets: inherit

  test-canary:
    needs: [build]
    uses: ./.github/workflows/x-test-canary.yml
    secrets: inherit

  # test-canary, common-test, and test all need only the build artifact.
  # We don't gate test/common-test on test-canary because canary is a
  # sanity check on the test harness itself, and serializing them adds
  # ~5-7 min of artifact-download cost on every push to defend against
  # a near-zero-probability condition. If canary fails the PR's
  # required-checks reflects that; test runs in parallel anyway.
  common-test:
    needs: [build]
    uses: ./.github/workflows/x-common-test.yml
    secrets: inherit

  test:
    needs: [build]
    uses: ./.github/workflows/x-test-full.yml
    secrets: inherit
