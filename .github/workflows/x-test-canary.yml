######################################################################
# A canary test suite, checking if the test suite is correctly
# working.
######################################################################
name: "arweave-test-suite-canary-template"

on:
  workflow_call:
    inputs:
      os_arch:
        description: "operating system architecture"
        default: "amd64"
        type: "string"
      os_name:
        description: "operating system name"
        default: "ubuntu"
        type: "string"
      os_release:
        description: "operating system release"
        default: "22.04"
        type: "string"

env:
  cache_key: ${{ inputs.os_arch }}-${{ inputs.os_name }}-${{ inputs.os_release }}

####################################################################
# Canary testing, should fail.
####################################################################
jobs:
  canary:
    runs-on:
      - self-hosted
      - build-runner
      - ${{ inputs.os_arch }}
      - ${{ inputs.os_name }}
      - ${{ inputs.os_release }}

    steps:
      - name: cleanup
        if: always()
        run: |
          rm -rf "${GITHUB_WORKSPACE}" && mkdir -p "${GITHUB_WORKSPACE}"

      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
          lfs: false

      - uses: ./.github/actions/kill-stray-erlang
        if: always()

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}-${{ env.cache_key }}

      # Both artifacts (_build and apps dir) are
      # required.
      - uses: ./.github/actions/ensure-zstd

      - name: Extract artifact
        run: |
          tar --use-compress-program='zstd -T0 -d' -xfp _build.tar.zst
          tar --use-compress-program='zstd -T0 -d' -xfp apps.tar.zst

      # The canary's whole purpose is to fail — we run it to verify
      # that the test harness can detect a failing test. We absorb its
      # failure inside this single step (no continue-on-error) so the
      # green job doesn't carry a misleading "completed with exit
      # code 1" annotation. The step succeeds iff the canary failed.
      - name: ar_canary.erl (expected to fail)
        run: |
          set +e
          bash scripts/github_workflow.sh "tests" "ar_canary"
          ec=$?
          if [ $ec -eq 0 ]; then
            echo "ERROR: ar_canary unexpectedly passed."
            echo "The canary harness is broken — investigate before"
            echo "trusting the rest of the CI run."
            exit 1
          fi
          echo "ar_canary failed as expected (exit code $ec)."
