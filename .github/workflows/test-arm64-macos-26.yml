######################################################################
# Test suite for MacOS. The support of MacOS is mainly for the VDF
# part, it should not be required to do the full test suite.
######################################################################
name: "Test on arch:arm64 distribution:macos release:26"

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# One run per branch at a time; see test-amd64-ubuntu-22.04.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/x-build.yml
    secrets: inherit
    with:
      os_arch: arm64
      os_name: macos
      os_release: 26

  test-canary:
    needs: [build]
    uses: ./.github/workflows/x-test-canary.yml
    secrets: inherit
    with:
      os_arch: arm64
      os_name: macos
      os_release: 26

  # test-canary, common-test, and test all need only the build artifact.
  # We don't gate test/common-test on test-canary because canary is a
  # sanity check on the test harness itself, and serializing them adds
  # ~5-7 min of artifact-download cost on every push to defend against
  # a near-zero-probability condition. If canary fails the PR's
  # required-checks reflects that; test runs in parallel anyway.
  common-test:
    needs: [build]
    uses: ./.github/workflows/x-common-test.yml
    secrets: inherit
    with:
      os_arch: arm64
      os_name: macos
      os_release: 26

  test:
    needs: [build]
    uses: ./.github/workflows/x-test-vdf.yml
    secrets: inherit
    with:
      os_arch: arm64
      os_name: macos
      os_release: 26
