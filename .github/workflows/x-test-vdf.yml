######################################################################
# Arweave Test Suite dedicated for VDF testing.
#
# Used by the macOS workflow (test-arm64-macos-26.yml). Runs only
# tests tagged `-test_category([vdf])` — modules whose correctness matters
# for a VDF deployment. Mining, chunk sync, repacking, P2P, etc. are
# excluded; we don't need to verify those work on macOS because
# macOS isn't a production target for them.
#
# The VDF module list is discovered dynamically from the source tree.
######################################################################
name: "arweave-test-suite-vdf"

on:
  workflow_call:
    inputs:
      os_arch:
        description: "operating system architecture"
        default: "amd64"
        type: "string"
      os_name:
        description: "operating system name"
        default: "ubuntu"
        type: "string"
      os_release:
        description: "operating system release"
        default: "22.04"
        type: "string"

env:
  cache_key: ${{ inputs.os_arch }}-${{ inputs.os_name }}-${{ inputs.os_release }}

jobs:
  discover-tests:
    runs-on:
      - self-hosted
      - build-runner
      - ${{ inputs.os_arch }}
      - ${{ inputs.os_name }}
      - ${{ inputs.os_release }}
    outputs:
      vdf_modules: ${{ steps.discover.outputs.vdf_modules }}
    steps:
      - name: cleanup
        if: always()
        run: |
          rm -rf "${GITHUB_WORKSPACE}" && mkdir -p "${GITHUB_WORKSPACE}"

      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: discover vdf modules
        id: discover
        run: |
          echo "vdf_modules=$(bash scripts/list_test_modules.sh vdf json)" >> "$GITHUB_OUTPUT"

  eunit-tests-suite:
    needs: discover-tests
    runs-on:
      - self-hosted
      - build-runner
      - ${{ inputs.os_arch }}
      - ${{ inputs.os_name }}
      - ${{ inputs.os_release }}

    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        core_test_mod: ${{ fromJson(needs.discover-tests.outputs.vdf_modules) }}
    steps:
      - name: cleanup
        if: always()
        run: |
          rm -rf "${GITHUB_WORKSPACE}" && mkdir -p "${GITHUB_WORKSPACE}"

      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
          lfs: false

      - uses: ./.github/actions/kill-stray-erlang
        if: always()

      - name: Fetch build (LAN cache, fallback to artifact)
        uses: ./.github/actions/fetch-build
        with:
          ssh-key: ${{ secrets.CI_CACHE_SSH_KEY }}
          cache-key: build-${{ github.sha }}-${{ env.cache_key }}

      - name: ${{ matrix.core_test_mod }}.erl
        id: tests
        run: bash scripts/github_workflow.sh "tests" "${{ matrix.core_test_mod }}"

      # this part of the job produces test artifacts from logs
      # generated by the tests. It also collect dumps and the files
      # present in .tmp (temporary arweave data store)
      - name: upload artifacts in case of failure
        uses: actions/upload-artifact@v4
        if: always() && failure()
        with:
          name: "logs-${{ matrix.core_test_mod }}-${{ github.run_attempt }}-${{ job.status }}-${{ runner.name }}-${{ github.sha }}"
          retention-days: 7
          overwrite: true
          include-hidden-files: true
          path: |
            ./logs
            *.out
            *.dump
