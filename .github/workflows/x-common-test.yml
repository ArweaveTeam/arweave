######################################################################
# Common Test suite. Mostly used on Linux like systems.
#
# Sharding, with the same `-test_category` convention as the eunit
# matrix in x-test-full.yml:
#   - discover-suites scans apps/*/test/*_SUITE.erl and emits the
#     shard matrix (scripts/list_ct_suites.sh). An untagged suite is
#     `slow` and gets a shard of its own; a suite tagged
#     `-test_category([fast])` is sliced round-robin into a few
#     batched shards with the other fast suites, since most take
#     seconds and would be all job overhead on their own.
#   - Each shard is a plain `rebar3 ct --suite ...` against the build
#     artifact, the same command `bin/ct` runs for a developer. The
#     fetch-build action refreshes the native-lib stamps after
#     extraction so rebar3's compile pre-hook is the no-op it is on a
#     developer's machine instead of a cmake tree walk (Linux) or a
#     rebuild (macOS) per shard. rebar3 still re-fetches its plugins
#     per shard (~10s): shipping them would add 6MB to every artifact
#     download a run makes, most of which never run rebar3.
#
# Coverage is off by default: cover instruments every executed line,
# and on the CPU-bound simulation suites (arweave_sync_sim_SUITE) that
# measured as a ~3x slowdown -- 32 min for the sim suite with cover
# against 10 min without. common-test-cover.yml runs this workflow
# with `cover: true` on demand when a report is wanted. A cover run is
# a single serial shard, so the report is not split across shards.
######################################################################
name: "arweave-common-test-suite"

on:
  workflow_call:
    inputs:
      cover:
        description: "run under cover and publish the coverage report"
        default: false
        type: "boolean"
      os_arch:
        description: "operating system architecture"
        default: "amd64"
        type: "string"
      os_name:
        description: "operating system name"
        default: "ubuntu"
        type: "string"
      os_release:
        description: "operating system release"
        default: "22.04"
        type: "string"

env:
  cache_key: ${{ inputs.os_arch }}-${{ inputs.os_name }}-${{ inputs.os_release }}
  # Authenticate dependency clones; see x-build.yml.
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: 'url.https://x-access-token:${{ github.token }}@github.com/.insteadOf'
  GIT_CONFIG_VALUE_0: 'https://github.com/'

jobs:
  # Single cheap job that scans the source tree and emits the shard
  # matrix as JSON. Source-only: the category attribute is read from
  # the .erl files, so no build artifact is needed here.
  discover-suites:
    runs-on:
      - self-hosted
      - build-runner
      - ${{ inputs.os_arch }}
      - ${{ inputs.os_name }}
      - ${{ inputs.os_release }}
    outputs:
      shards: ${{ steps.discover.outputs.shards }}
    steps:
      - name: cleanup
        if: always()
        run: |
          rm -rf "${GITHUB_WORKSPACE}" && mkdir -p "${GITHUB_WORKSPACE}"

      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      # Two batches of the fast suites: together they run in ~3 min,
      # so more shards would only add per-job overhead. A cover run
      # collapses everything into one serial shard (see header).
      - name: discover suites
        id: discover
        env:
          BATCHES: ${{ inputs.cover && 'all' || '2' }}
        run: |
          shards=$(bash scripts/list_ct_suites.sh matrix "${BATCHES}")
          echo "Discovered shards: ${shards}"
          echo "shards=${shards}" >> "$GITHUB_OUTPUT"

  common-test-suite:
    needs: discover-suites
    # The matrix values would otherwise be appended to the job name,
    # and `suites` is a long comma-separated path list.
    name: ${{ matrix.name }}
    runs-on:
      - self-hosted
      - build-runner
      - ${{ inputs.os_arch }}
      - ${{ inputs.os_name }}
      - ${{ inputs.os_release }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover-suites.outputs.shards) }}
    steps:
      - name: cleanup
        if: always()
        run: |
          rm -rf "${GITHUB_WORKSPACE}" && mkdir -p "${GITHUB_WORKSPACE}"

      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
          lfs: false

      - uses: ./.github/actions/kill-stray-erlang
        if: always()

      - name: Fetch build (LAN cache, fallback to artifact)
        uses: ./.github/actions/fetch-build
        with:
          ssh-key: ${{ secrets.CI_CACHE_SSH_KEY }}
          cache-key: build-${{ github.sha }}-${{ env.cache_key }}

      # Plain `ct` (not `as test ct`): the ct task already runs under
      # the test profile, and `as` splits every argument on commas,
      # which breaks the comma-separated `--suite` list (see bin/ct).
      # ERL_FLAGS reaches the rebar3 VM, which is the one CT runs in,
      # so the shard gets the shared test VM policy (+sbwt none) that
      # keeps idle schedulers from starving the runner agent.
      # The path is absolute because ERL_FLAGS is an environment
      # variable: every Erlang VM started while this step runs inherits
      # it, and not all of them start in the repository root. CT
      # changes into its log directory before a suite runs, so a suite
      # that boots a peer node starts it from there, and a relative
      # `config/vm.args.test' does not exist relative to that
      # directory. The peer then dies with "Failed to open arguments
      # file" before the test begins.
      - name: run shard ${{ matrix.name }}
        env:
          ERL_FLAGS: -args_file ${{ github.workspace }}/config/vm.args.test
          COVER_FLAG: ${{ inputs.cover && '--cover' || '' }}
        run: |
          mkdir -p logs/ct
          # shellcheck disable=SC2086
          ./rebar3 ct \
            ${COVER_FLAG} \
            --verbose \
            --logdir logs/ct \
            --suite "${{ matrix.suites }}"

      # generate coverage report, it will be stored in
      # _build/test/cover directory
      - name: run cover
        id: cover
        if: ${{ inputs.cover }}
        run: |
          ./rebar3 as test cover \
            --verbose

      # generate markdown/html like report to have a quick view of
      # what happened during the tests
      - name: generate workflow summary
        if: always()
        run: |-
          if test -f ./_build/test/cover/index.html
          then
            echo "# Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo >> $GITHUB_STEP_SUMMARY
            cat ./_build/test/cover/index.html >> $GITHUB_STEP_SUMMARY
          fi

          # cth_surefire (see rebar.config) drops a junit_report.xml
          # next to the HTML report, so a CT failure
          # shows up here rather than only inside the uploaded log
          # artifact.
          for f in ./logs/ct/*/junit_report.xml
          do
            test -f "${f}" || continue
            echo "# Common Test Report: ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
            echo >> $GITHUB_STEP_SUMMARY
            ./scripts/surefire_to_html.py "${f}" >> $GITHUB_STEP_SUMMARY
          done

      # upload test coverage report as artifact.
      - name: upload coverage report
        uses: actions/upload-artifact@v4
        if: ${{ inputs.cover }}
        with:
          name: "coverage-common_test-${{ github.run_attempt }}-${{ job.status }}-${{ runner.name }}-${{ github.sha }}"
          retention-days: 7
          overwrite: true
          include-hidden-files: true
          path: |
            ./_build/test/cover

      # Belt-and-suspenders against any test that leaves a file under
      # ./logs at mode 000 (eg. arweave_config_file_SUITE
      # exercising unreadable-file parsing): the upload step below
      # walks the tree and fails with EACCES if it hits one.
      - name: fix permissions for artifact upload
        if: always()
        run: chmod -R u+rwX ./logs 2>/dev/null || true

      # this part of the job produces test artifacts from logs
      # generated by the tests. It also collect dumps and the files
      # present in .tmp (temporary arweave data store)
      - name: upload artifacts in case of failure
        uses: actions/upload-artifact@v4
        if: always() && failure()
        with:
          name: "logs-common_test-${{ matrix.name }}-${{ github.run_attempt }}-${{ job.status }}-${{ runner.name }}-${{ github.sha }}"
          retention-days: 7
          overwrite: true
          include-hidden-files: true
          path: |
            ./logs
            *.out
            *.dump
