######################################################################
# Full Arweave Test Suite. Mostly used on Linux like systems.
######################################################################
name: "arweave-common-test-suite"

on:
  workflow_call:
    inputs:
      os_arch:
        description: "operating system architecture"
        default: "amd64"
        type: "string"
      os_name:
        description: "operating system name"
        default: "ubuntu"
        type: "string"
      os_release:
        description: "operating system release"
        default: "22.04"
        type: "string"

env:
  cache_key: ${{ inputs.os_arch }}-${{ inputs.os_name }}-${{ inputs.os_release }}

####################################################################
# Test modules (note: that _tests are implicitly run by a matching
# prefix name
####################################################################
jobs:
  common-test-suite:
    runs-on:
      - self-hosted
      - build-runner
      - ${{ inputs.os_arch }}
      - ${{ inputs.os_name }}
      - ${{ inputs.os_release }}
    steps:
      - name: cleanup
        if: always()
        run: |
          rm -rf "${GITHUB_WORKSPACE}" && mkdir -p "${GITHUB_WORKSPACE}"

      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
          lfs: false

      - uses: ./.github/actions/kill-stray-erlang
        if: always()

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}-${{ env.cache_key }}

      # Both artifacts (_build and apps dir) are
      # required.
      - uses: ./.github/actions/ensure-zstd

      - name: Extract artifact
        run: |
          tar --use-compress-program='zstd -T0 -d' -xpf _build.tar.zst
          tar --use-compress-program='zstd -T0 -d' -xpf apps.tar.zst

      # macOS reuses the build artifact across users and CMake bakes
      # absolute paths into the prebuilt libs, so there they must be
      # cleaned + rebuilt before the test. On Linux the artifact is built
      # on the same toolchain image and the libs are relocatable
      # (priv/*.so carry no RPATH, only system NEEDED) and arch-portable
      # (RandomX builds a fixed baseline, not -march=native), so reuse
      # them as-is -- rebuilding per case there only spawns a cc1plus CPU
      # storm that starves the runner agent ("lost communication" severs).
      - name: external libraries fix (macOS only)
        if: ${{ inputs.os_name == 'macos' }}
        run: make -C apps/arweave/lib clean

      # execute common test suite with test profile and coverage
      # enabled.
      - name: run common test suite
        id: common-tests
        run: |
          ./rebar3 as test ct \
            --cover \
            --verbose \
            --logdir _ct_logs

      # execute eunit in standalone on only a small subset of
      # application available. Because arweave main application is
      # using eunit for its test suite in a specific way, testing this
      # application will crash the test suite.
      - name: run eunit test suite
        id: eunit
        run: |
          ./rebar3 as test eunit \
            --cover \
            --application arweave_config

      # generate coverage report, it will be stored in
      # _build/test/cover directory
      - name: run cover
        id: cover
        run: |
          ./rebar3 as test cover \
            --verbose

      # generate markdown/html like report to have a quick view of
      # what happened during the tests
      - name: generate workflow summary
        run: |-
          if test -f ./_build/test/cover/index.html
          then
            echo "# Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo >> $GITHUB_STEP_SUMMARY
            cat ./_build/test/cover/index.html >> $GITHUB_STEP_SUMMARY
          fi

          if test -d ./_build/test/surefire
          then
            echo "# Eunit Report" >> $GITHUB_STEP_SUMMARY
            echo >> $GITHUB_STEP_SUMMARY
            for f in ./_build/test/surefire/*.xml
            do
              ./scripts/surefire_to_html.py "${f}" >> $GITHUB_STEP_SUMMARY
            done
          fi

      # upload test coverage report as artifact.
      - name: upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: "coverage-common_test-${{ github.run_attempt }}-${{ job.status }}-${{ runner.name }}-${{ github.sha }}"
          retention-days: 7
          overwrite: true
          include-hidden-files: true
          path: |
            ./_build/test/cover
            ./_build/test/surefire

      # Belt-and-suspenders against any test that leaves a file under
      # _ct_logs or ./logs at mode 000 (eg. arweave_config_file_SUITE
      # exercising unreadable-file parsing): the upload step below
      # walks the tree and fails with EACCES if it hits one.
      - name: fix permissions for artifact upload
        if: always()
        run: chmod -R u+rwX _ct_logs ./logs 2>/dev/null || true

      # this part of the job produces test artifacts from logs
      # generated by the tests. It also collect dumps and the files
      # present in .tmp (temporary arweave data store)
      - name: upload artifacts in case of failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "logs-common_test-${{ github.run_attempt }}-${{ job.status }}-${{ runner.name }}-${{ github.sha }}"
          retention-days: 7
          overwrite: true
          include-hidden-files: true
          path: |
            ./_ct_logs
            ./logs


